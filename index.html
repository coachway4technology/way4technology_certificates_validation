<!DOCTYPE html>
<html>
<head>
    <title>Way4Technology Certificate Verification</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            color: white;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: rgba(0,0,0,0.6);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            margin: auto;
        }

        input {
            padding: 12px;
            width: 70%;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 12px 20px;
            background: #00ffcc;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }

        button:hover {
            background: #00cca3;
        }

        #result {
            margin-top: 25px;
            text-align: left;
        }

        h1 {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Way4Technology – Certificate Verification Portal</h1>

    <input type="text" id="certId" placeholder="Enter Certificate ID">
    <button onclick="verifyCertificate()">Verify</button>

    <div id="result"></div>
</div>

<script src="students.js"></script>

<script>
function verifyCertificate() {
    const id = document.getElementById("certId").value.trim();
    const resultDiv = document.getElementById("result");

    if (students[id]) {
        const s = students[id];

        resultDiv.innerHTML = `
            <h2>✅ Certificate Verified</h2>
            <p><b>Name:</b> ${s.name}</p>
            <p><b>Class:</b> ${s.class}</p>
            <p><b>Section:</b> ${s.section}</p>
            <p><b>School:</b> ${s.school}</p>
            <p><b>Academic Year:</b> ${s.academic_year}</p>
            <p><b>Course:</b> ${s.course_completed}</p>
            <p><b>Instructor:</b> ${s.instructor}</p>
            <p><b>Duration:</b> ${s.duration}</p>
            <p><b>Mode:</b> ${s.mode}</p>
            <p><b>Issue Date:</b> ${s.issue_date}</p>
            <p><b>Issued By:</b> ${s.issued_by}</p>
        `;
    } else {
        resultDiv.innerHTML = "<h2>❌ Certificate Not Found</h2>";
    }
}
</script>

</body>
</html>
